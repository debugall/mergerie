<!-- Lightbox : aperçu d'une image de pièce jointe Jira en grand (clic sur une vignette). -->
<div id="jiraLightbox" class="modal jira-lightbox" hidden>
    <figure class="jira-lightbox-fig">
        <img id="jiraLightboxImg" src="" alt="" />
        <figcaption class="jira-lightbox-cap"><span id="jiraLightboxName"></span> <a id="jiraLightboxOpen" href="" target="_blank" rel="noopener noreferrer" data-i18n="jira.open-new-tab">Ouvrir dans un onglet ↗</a></figcaption>
    </figure>
</div>

<!-- Jira → Stats : la liste des tickets derrière un nombre (clic sur une tuile ou un compte des
     tableaux). Rien n'est redemandé à Jira : tout a été lu pour compter. -->
<div id="jiraStatsListModal" class="modal" hidden>
    <div class="modal-box jira-stats-list-box">
        <h3 id="jiraStatsListTitle"></h3>
        <div id="jiraStatsListBody" class="jira-stats-list"></div>
        <div class="modal-actions">
            <span class="spacer"></span>
            <button type="button" class="btn" id="jiraStatsListClose" data-i18n="ui.close">Fermer</button>
        </div>
    </div>
</div>
