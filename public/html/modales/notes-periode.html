<!-- Modale : le diff d'un push direct (Notes → Période). Deux SHA résolus dans le clone,
     `base..head` — ce qui est entré dans la branche sans merge request, tel quel. -->
<div id="periodeDiffModal" class="modal" hidden>
    <div class="modal-box notes-periode-diff-box">
        <h3><span data-i18n="notes.periode.btn.diff">Voir le diff</span> <span id="periodeDiffTitle" class="muted"></span></h3>
        <div id="periodeDiffBody" class="notes-periode-diff"></div>
        <div class="modal-actions">
            <span class="spacer"></span>
            <button type="button" class="btn" id="periodeDiffClose" data-i18n="ui.close">Fermer</button>
        </div>
    </div>
</div>
