<!-- Modale : merger une MR (options appliquées par la forge) -->
<div id="mergeModal" class="modal" hidden>
    <div class="modal-box">
        <h3 data-i18n="merge.modal.title">Merger la merge request</h3>
        <p id="mergeModalIntro" class="muted"></p>
        <!-- TOP 16 : ce qu'on sait de cette merge request, AVANT le geste irréversible. Note,
             verdict, rapport périmé, constats bloquants, remarques jamais envoyées : tout est
             déjà dans la charge utile de la liste, et rien de tout cela n'était rappelé ici. -->
        <p id="mergeModalSavoir" class="card-tags" hidden></p>
        <div class="modal-fields">
            <label class="inline-check inline-check-mid"><input id="mergeSquash" type="checkbox" />
                <span data-i18n="merge.modal.squash">Squash : réunir les commits de la branche en un seul</span></label>
            <label class="inline-check inline-check-mid"><input id="mergeRemoveBranch" type="checkbox" />
                <span data-i18n="merge.modal.remove-branch">Supprimer la branche source après le merge</span></label>
            <!-- B2 : fermer la boucle Jira au moment où on merge. Décochée par défaut et
                 mémorisée par projet Jira — écrire chez les autres se décide, mais on ne
                 redemande pas tous les jours à quelqu'un qui a déjà dit oui. -->
            <label class="inline-check inline-check-mid" id="mergeJiraRow" hidden><input id="mergeJira" type="checkbox" />
                <span id="mergeJiraLbl" data-i18n="merge.modal.jira">Passer le ticket à l’état suivant et y déposer le lien</span></label>
        </div>
        <p id="mergeModalNote" class="converge-note" hidden><svg class="ico ico-sm"><use href="#i-alert"/></svg> <span></span></p>
        <!-- CE QUE LA FORGE DIT DE CETTE MERGE REQUEST, demandé à l'ouverture de la modale.
             On est à un clic d'une action irréversible : « elle est en conflit » se dit AVANT,
             pas dans le message d'erreur qui suivra le refus. -->
        <p id="mergeConflictNote" class="converge-note note-bad" hidden><svg class="ico ico-sm"><use href="#i-alert"/></svg> <span></span></p>
        <div class="modal-actions">
            <button id="mergeRebase" type="button" class="btn" hidden><svg class="ico"><use href="#i-repeat"/></svg><span></span></button>
            <button id="mergeCancel" type="button" class="btn" data-i18n="ui.cancel">Annuler</button>
            <button id="mergeGo" type="button" class="btn btn-danger btn-solid"><svg class="ico"><use href="#i-merge"/></svg><span data-i18n="merge.modal.go">Merger</span></button>
        </div>
    </div>
</div>

<!-- Commit du merge : le message arrive PRÉ-REMPLI avec celui que git a écrit lui-même
     (`MERGE_MSG`), conventions du dépôt comprises. On le relit, on le corrige, on valide. -->
<div id="mergeCommitModal" class="modal" hidden>
    <div class="modal-box">
        <h3 data-i18n="git.merge.commit.title">Commiter le merge</h3>
        <p id="mergeCommitIntro" class="muted"></p>
        <div class="modal-fields">
            <label><span data-i18n="git.merge.commit.msg">Message de commit</span>
                <textarea id="mergeCommitMsg" rows="5"></textarea></label>
        </div>
        <div class="modal-actions">
            <button id="mergeCommitCancel" type="button" class="btn" data-i18n="ui.cancel">Annuler</button>
            <button id="mergeCommitGo" type="button" class="btn btn-primary"><svg class="ico"><use href="#i-save"/></svg><span data-i18n="git.merge.commit.go">Commiter</span></button>
        </div>
    </div>
</div>
