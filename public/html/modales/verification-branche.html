<!-- Vérifier une BRANCHE, sans merge request : « est-ce que develop est encore vert ? ».
     Une ligne par dépôt couvert par le vérificateur, chacune sur sa branche par défaut. Le
     choix passe par un sélecteur À RECHERCHE : un dépôt actif aligne des centaines de branches. -->
<div id="branchVerifyModal" class="modal" hidden>
    <div class="modal-box">
        <h3 data-i18n="verify.branch.title">Vérifier une branche</h3>
        <p class="muted" data-i18n="verify.branch.help">Coche les dépôts à vérifier et choisis leur branche — pas besoin de les prendre tous. Le verdict porte sur les branches elles-mêmes : pas de comparaison avec une base, et rien n'est imputé à personne.</p>
        <label><span data-i18n="verify.branch.verifier">Vérificateur</span>
            <select id="branchVerifySelect"></select>
        </label>
        <div id="branchVerifyRows" class="modal-fields"></div>
        <div class="modal-actions">
            <button id="branchVerifyCancel" type="button" class="btn" data-i18n="ui.cancel">Annuler</button>
            <button id="branchVerifyGo" type="button" class="btn btn-primary"><svg class="ico"><use href="#i-play"/></svg><span data-i18n="verify.pick.go">Lancer</span></button>
        </div>
    </div>
</div>
