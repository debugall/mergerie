<!-- Modale : un job Jenkins — ses paramètres, ses derniers builds, sa console. C'est ici
     qu'on lance : un job paramétré demande une décision (quelle version, quel environnement),
     et la remplir ailleurs que devant l'historique reviendrait à lancer à l'aveugle. -->
<div id="jenkinsModal" class="modal" hidden>
    <div class="modal-box modal-lg">
        <h3 id="jenkinsModalTitle"></h3>
        <p id="jenkinsModalDesc" class="muted"></p>
        <div id="jenkinsModalBody" class="modal-fields"></div>
        <div class="modal-actions">
            <button type="button" class="btn" id="jenkinsClose" data-i18n="ui.close">Fermer</button>
            <button type="button" class="btn btn-primary" id="jenkinsRun"><svg class="ico"><use href="#i-play"/></svg><span data-i18n="jenkins.run">Lancer</span></button>
        </div>
    </div>
</div>

<!-- Modale : les dossiers rangés hors du filtre. Ils ne tenaient pas en pied de liste — une
     rangée de boutons qu'on ne clique presque jamais mangeait la place de ce qu'on regarde
     vraiment. Ils se comptent donc en un mot, et se retrouvent ici quand on le demande. -->
<div id="jenkinsHiddenModal" class="modal" hidden>
    <div class="modal-box">
        <h3 data-i18n="jenkins.hidden.title">Dossiers masqués</h3>
        <p class="muted" data-i18n="jenkins.hidden.intro">Ils sont hors de la liste des filtres, et leurs jobs hors de la liste. Remets ceux dont tu as de nouveau besoin.</p>
        <div id="jenkinsHiddenList" class="jk-hidden-list"></div>
        <div class="modal-actions">
            <button type="button" class="btn" id="jenkinsHiddenClose" data-i18n="ui.close">Fermer</button>
            <button type="button" class="btn btn-primary" id="jenkinsHiddenAll" data-i18n="jenkins.hidden.all">Tout remettre</button>
        </div>
    </div>
</div>

<!-- Modale : la console d'un build. Bornée aux derniers caractères : l'erreur est en bas. -->
<div id="jenkinsLogModal" class="modal" hidden>
    <div class="modal-box modal-lg">
        <h3 id="jenkinsLogTitle"></h3>
        <pre id="jenkinsLogBody" class="jk-log"></pre>
        <div class="modal-actions">
            <button type="button" class="btn" id="jenkinsLogClose" data-i18n="ui.close">Fermer</button>
            <!-- B9 : la console est l'endroit où l'on LIT la trace. L'enquêteur d'incident
                 n'était proposé que depuis un ticket Jira, alors que c'est ici qu'on a le
                 texte sous les yeux. Le bouton n'apparaît que si la console contient bien
                 quelque chose qui ressemble à une trace. -->
            <button type="button" class="btn btn-primary" id="jenkinsLogInvestigate" hidden><svg class="ico"><use href="#i-search"/></svg><span data-i18n="jenkins.log.investigate">Enquêter</span></button>
        </div>
    </div>
</div>
