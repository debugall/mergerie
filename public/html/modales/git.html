<!-- Comparer : le contenu d'un fichier des deux côtés. Ouverte en cliquant un fichier de
     l'une des trois colonnes — c'est la question qui suit immédiatement « il est des deux
     côtés mais différent » : différent COMMENT ? -->
<div id="compareFileModal" class="modal" hidden>
    <div class="modal-box cmp-file-box">
        <h3 id="compareFilePath"></h3>
        <p id="compareFileSides" class="muted"></p>
        <div id="compareFileBody" class="cmp-diff"></div>
        <div class="modal-actions">
            <button id="compareFileClose" type="button" class="btn" data-i18n="context.title.fermer-echap">Fermer (Échap)</button>
        </div>
    </div>
</div>

<!-- Git → Vérificateur : préparer (ou modifier) une vérification. Les dépôts se cochent dans une
     liste filtrable, chacun avec sa branche ou son tag (sélecteur à recherche) ; les vérificateurs se
     cochent dans l'ordre où ils tourneront. -->
<div id="planVerifModal" class="modal" hidden>
    <div class="modal-box modal-lg">
        <h3 id="planVerifTitle" data-i18n="git.verif.modal.title">Préparer une vérification</h3>
        <label><span data-i18n="git.verif.modal.name">Nom</span>
            <input id="planVerifName" type="text" maxlength="120" placeholder="Recette du vendredi" data-i18n-placeholder="git.verif.modal.name-ph" />
        </label>
        <h4 data-i18n="git.verif.modal.repos">Dépôts et refs</h4>
        <div id="planVerifRepos" class="modal-fields"></div>
        <h4 data-i18n="git.verif.modal.verifiers">Vérificateurs, dans l'ordre</h4>
        <p class="field-note" data-i18n="git.verif.modal.verifiers-help">L'ordre où tu les coches est l'ordre où ils tournent. Un vérificateur qui ne couvre aucun dépôt coché est grisé.</p>
        <div id="planVerifVerifiers" class="modal-fields"></div>
        <div class="modal-actions">
            <button id="planVerifCancel" type="button" class="btn" data-i18n="ui.cancel">Annuler</button>
            <button id="planVerifSave" type="button" class="btn btn-primary"><svg class="ico"><use href="#i-check"/></svg><span data-i18n="git.verif.modal.create">Créer</span></button>
        </div>
    </div>
</div>
