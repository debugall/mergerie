<!-- Ce que l'installation va faire, AVANT de la lancer : le modèle (avec sa taille), la
     détection de voix, et le GPU quand le système en propose un. La confirmation nomme ce
     qui va se passer, système par système — un téléchargement de 1,6 Go ne se déclenche pas
     d'un clic muet. -->
<div id="dictInstallModal" class="modal" hidden>
    <div class="modal-box">
        <h3 data-i18n="settings.dictation.options.title">Installer le moteur de dictée</h3>
        <div class="form">
            <label><span data-i18n="settings.dictation.options.model">Modèle</span>
                <select id="dictInstallModel">
                    <option value="large-v3-turbo" data-i18n="settings.dictation.model.turbo">large-v3-turbo</option>
                    <option value="large-v3-turbo-q8_0" data-i18n="settings.dictation.model.turbo-q8">large-v3-turbo-q8_0</option>
                    <option value="large-v3-turbo-q5_0" data-i18n="settings.dictation.model.turbo-q5">large-v3-turbo-q5_0</option>
                    <option value="large-v3" data-i18n="settings.dictation.model.large">large-v3</option>
                    <option value="large-v3-q5_0" data-i18n="settings.dictation.model.large-q5">large-v3-q5_0</option>
                </select>
            </label>
            <label class="check"><input type="checkbox" id="dictInstallVad" checked />
                <span data-i18n="settings.dictation.options.vad">Télécharger aussi la détection de voix (recommandé)</span></label>
            <label id="dictInstallGpuBox" hidden><span data-i18n="settings.dictation.options.gpu">Accélération</span>
                <select id="dictInstallGpu">
                    <option value="" data-i18n="settings.dictation.options.gpu-none">Aucune (processeur)</option>
                    <option value="cuda" data-i18n="settings.dictation.options.gpu-cuda">CUDA (carte NVIDIA)</option>
                    <option value="vulkan" data-i18n="settings.dictation.options.gpu-vulkan">Vulkan (toute carte)</option>
                </select>
            </label>
            <h4 data-i18n="settings.dictation.confirm.title">Ce qui va se passer</h4>
            <p id="dictInstallConfirm" class="muted"></p>
        </div>
        <div class="modal-actions">
            <button id="dictInstallGo" type="button" class="btn btn-primary"><svg class="ico"><use href="#i-download"/></svg><span data-i18n="settings.dictation.options.start">Installer</span></button>
            <button id="dictInstallCancel" type="button" class="btn" data-i18n="ui.cancel">Annuler</button>
        </div>
    </div>
</div>
