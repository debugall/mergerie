<!-- Rapport de vérification : ce que le script a répondu, et ce qu'on en conclut.
     Tout ce qui vient du script est ÉCHAPPÉ (donnée non fiable, jamais interprétée). -->
<div id="verifyModal" class="modal" hidden>
    <div class="modal-box modal-wide">
        <h3 id="verifyModalTitle" data-i18n="verify.report.title">Rapport de vérification</h3>
        <div id="verifyReport"></div>
        <!-- Publication en commentaire : le corps est PRÉ-REMPLI puis relu. Il n'apparaît qu'à
             la demande — un champ de texte ouvert sous chaque rapport inviterait à publier par
             réflexe, alors que ça écrit sur la merge request que d'autres lisent. -->
        <div id="verifyCommentBox" hidden>
            <p id="verifyCommentWhere" class="muted"></p>
            <textarea id="verifyCommentBody" rows="10" spellcheck="false"></textarea>
            <p id="verifyCommentPosted" class="field-note" hidden></p>
        </div>
        <div class="modal-actions">
            <button id="verifyClose" type="button" class="btn" data-i18n="ui.close">Fermer</button>
            <button id="verifyComment" type="button" class="btn" hidden><svg class="ico"><use href="#i-doc"/></svg><span data-i18n="verify.btn.comment">Publier en commentaire</span></button>
            <button id="verifyCommentSend" type="button" class="btn btn-primary" hidden><svg class="ico"><use href="#i-upload"/></svg><span data-i18n="verify.btn.comment-send">Publier sur la merge request</span></button>
            <!-- B9 : « Corriger » demande de réparer ; « Enquêter » demande OÙ ça casse. Les
                 deux ne s'adressent pas au même moment — un test rouge dont on ne comprend pas
                 la trace ne se corrige pas, il se cherche d'abord. -->
            <button id="verifyInvestigate" type="button" class="btn" hidden><svg class="ico"><use href="#i-search"/></svg><span data-i18n="verify.btn.investigate">Enquêter</span></button>
            <button id="verifyFix" type="button" class="btn btn-primary" hidden><svg class="ico"><use href="#i-bot"/></svg><span data-i18n="verify.btn.fix">Corriger (session IA)</span></button>
            <!-- A/Reviews 3 : après un verdict VERT, la suite. « Merger » et « Lancer <job> »
                 existaient dans le menu ⋯ de la carte, sous exactement cette condition — mais
                 pas là où l'on vient de lire le verdict, c'est-à-dire là où l'on décide. -->
            <span id="verifySuite"></span>
        </div>
    </div>
</div>

<!-- Confirmation avant de lancer une vérification. Elle ne sert pas seulement à choisir :
     lancer des commandes sur sa machine mérite un écran qui annonce lesquelles, où, et sur
     quels commits. D'où une modale même quand un seul vérificateur couvre le dépôt. -->
<div id="verifyPickModal" class="modal" hidden>
    <div class="modal-box">
        <h3 data-i18n="verify.pick.title">Lancer la vérification</h3>
        <p id="verifyPickWhat" class="muted"></p>
        <div id="verifyPickList" class="modal-fields"></div>
        <div id="verifyPickDetail" class="verify-pick-detail"></div>
        <div class="modal-actions">
            <button id="verifyPickCancel" type="button" class="btn" data-i18n="ui.cancel">Annuler</button>
            <button id="verifyPickGo" type="button" class="btn btn-primary"><svg class="ico"><use href="#i-play"/></svg><span data-i18n="verify.pick.go">Lancer</span></button>
        </div>
    </div>
</div>
