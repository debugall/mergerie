<div id="logPanel" class="logpanel" hidden>
    <div id="logBar" class="logbar" hidden><div id="progressBar"></div></div>
    <div class="loghead">
        <button id="logToggle" class="log-toggle" title="Déplier / replier les logs" data-i18n-title="ui.title.deplier-replier-les-logs">▸</button>
        <span id="logStatus" class="logstatus"></span>
        <span id="logElapsed" class="logelapsed" hidden></span>
        <span class="spacer"></span>
        <button id="logStop" class="btn btn-sm btn-danger" hidden title="Arrêter immédiatement le job en cours" data-i18n-title="ui.title.arreter-immediatement-le-job-en"><svg class="ico"><use href="#i-stop"/></svg><span data-i18n="ui.btn.stop">Stop</span></button>
        <button id="logResult" class="btn btn-sm btn-primary" type="button" hidden><svg class="ico ico-sm"><use href="#i-eye"/></svg><span data-i18n="job.result.open">Voir le rapport</span></button>
    <button id="logRetry" class="btn btn-sm" hidden title="Rejouer ce job sur le même objet — une review reprend là où elle s'est arrêtée" data-i18n-title="job.retry.title"><svg class="ico"><use href="#i-repeat"/></svg><span data-i18n="job.retry.btn">Relancer</span></button>
    <!-- Un « Relancer » absent sur un job en échec se lit comme un oubli : on dit pourquoi. -->
    <span id="logNoRetry" class="muted" hidden></span>
        <label class="muted"><input type="checkbox" id="logAutoscroll" checked /><span data-i18n="ui.lbl.auto-defilement">auto-défilement</span></label>
        <button id="logCopy" class="btn btn-sm btn-ghost" title="Copier tout le journal dans le presse-papier" data-i18n-title="ui.title.copier-tout-le-journal-dans" data-i18n="ui.btn.copier">copier</button>
        <button id="logQueueBtn" class="btn btn-sm btn-ghost" hidden title="Voir les jobs en attente" data-i18n-title="job.queue.title"><svg class="ico"><use href="#i-inbox"/></svg><span data-i18n="job.queue.btn">En attente</span><span id="logQueueCount" class="nav-health warn">0</span></button>
        <button id="logHistBtn" class="btn btn-sm btn-ghost" title="Ce que tu as lancé et ce qui s'est terminé" data-i18n-title="job.hist.title"><svg class="ico"><use href="#i-clock"/></svg><span data-i18n="job.hist.btn">Activité</span><span id="logHistCount" class="nav-health warn" hidden>0</span></button>
        <!-- A41 : chercher DANS le journal. Un run de vérification déverse deux mille lignes ;
             retrouver « ECONNREFUSED » ou ne garder que les erreurs se faisait au défilement,
             à l'œil. Le champ MASQUE les lignes qui ne correspondent pas — il ne coupe rien. -->
        <input id="logFilter" class="search log-filter" type="search" placeholder="Filtrer le journal…" data-i18n-placeholder="job.log.filter-ph" />
        <label class="inline-check"><input type="checkbox" id="logErrOnly" /><span data-i18n="job.log.err-only">Erreurs</span></label>
        <span id="logFilterInfo" class="muted"></span>
        <button id="logHide" class="btn btn-sm btn-ghost" title="Masquer le panneau de logs" data-i18n-title="ui.title.masquer-le-panneau-de-logs" data-i18n="ui.btn.masquer">masquer</button>
    </div>
    <!-- File d'attente : dépliée à la demande, au-dessus du journal. -->
    <div id="logQueue" class="log-queue" hidden></div>
    <!-- Journal d'activité : ce qui a tourné, dépliable à la demande, au même endroit que la file. -->
    <!-- Quarante lignes de tous types mêlés : on cherchait « la review d'hier » à l'œil. -->
    <div id="logHistBar" class="log-queue log-hist-bar" hidden>
        <input id="histFilter" class="search" type="search" placeholder="Filtrer (objet, type, erreur)…" data-i18n-placeholder="job.hist.filter-ph" />
        <label class="inline-check"><input type="checkbox" id="histErrOnly" /><span data-i18n="job.hist.err-only">Échecs seulement</span></label>
    </div>
    <div id="logHist" class="log-queue" hidden></div>
    <!-- Onglets : un par job EN COURS. Masqués tant qu'il n'y en a qu'un — un onglet
         solitaire n'apprend rien et vole une ligne au journal. -->
    <div id="logTabs" class="log-tabs" hidden></div>
    <div id="logBox" hidden></div>
</div>
