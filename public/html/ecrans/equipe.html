    <!-- Équipe : « Notre matin ». Où en est-on, qui attend quoi, depuis quand — sept listes de faits
         calculées sur ce que l'équipe partage déjà par le dépôt de données. Rien sur une personne qui
         ne soit l'état d'un travail ; aucune action ici, chaque ligne mène à la carte. -->
    <section id="tab-team" class="tab">
        <div class="toolbar equipe-toolbar">
            <h2 style="margin:0"><span data-i18n="team.title">Équipe</span> <span class="muted equipe-sous-titre" data-i18n="team.subtitle">Notre matin</span></h2>
            <span class="spacer"></span>
            <select id="equipeGroupe" class="equipe-filtre" data-i18n-aria="team.filter.group" aria-label="Groupe de dépôts"></select>
            <select id="equipePersonne" class="equipe-filtre" data-i18n-aria="team.filter.person" aria-label="Personne"></select>
            <button id="equipeSync" class="btn" title="" data-i18n-title="team.sync.title"><svg class="ico"><use href="#i-refresh"/></svg><span data-i18n="team.sync">Synchroniser maintenant</span></button>
        </div>
        <div id="equipeBox"></div>
    </section>
